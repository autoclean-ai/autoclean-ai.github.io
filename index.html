<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoClean</title>
<meta name="description" content="AutoClean – clean junk files and free up storage on your Android phone.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root { --brand: #2F80ED; --accent: #1A6FE0; --text: #13233A; --muted: #5B6B82; --bg: #F3F8FF; }
  @media (prefers-color-scheme: dark) { :root { --accent: #7FB6FF; --text: #EAF2FF; --muted: #93A4BD; --bg: #0B1422; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--text);
    background: radial-gradient(circle at 70% 0%, rgba(22,194,163,.22), transparent 60%), var(--bg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 24px 16px; }
  main { text-align: center; max-width: 440px; }
  .logo { width: 104px; height: 104px; border-radius: 26px; margin: 0 auto 20px; display: block;
    box-shadow: 0 12px 40px rgba(47,128,237,.35); }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: .3px; }
  .tag { margin: 0 0 28px; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
  nav { display: flex; gap: 24px; justify-content: center; font-size: 15px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="">
  <h1>AutoClean</h1>
  <p class="tag">Clean junk files, find large and duplicate files, and free up storage on your Android phone.</p>
  <nav>
    <a href="privacy/">Privacy Policy</a>
    <a href="mailto:Namnguyen1980plus@gmail.com">Contact</a>
  </nav>
</main>
</body>
</html>
